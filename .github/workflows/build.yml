name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - uses: actions/checkout@v4

      # 2. Set up Java JDK 17 (Required for Android Gradle Plugin & SDK 36)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Or your specific version
          channel: 'stable'
          cache: true

      # 4. Clean previous build artifacts
      - name: Clean build environment
        run: flutter clean

      # 5. Fetch all new pub dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Build APK
      - name: Build APK
        run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExpenseTracker-APK
        path: build/app/outputs/flutter-apk/app-release.apk
