name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Scaffolding
      run: flutter create --platforms=android --org=com.expensetracker.app .

    - name: Inject Android Permissions
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_SMS"\/>\n    <uses-permission android:name="android.permission.RECEIVE_SMS"\/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>' android/app/src/main/AndroidManifest.xml

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExpenseTracker-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        name: ExpenseTracker-APK
        path: build/app/outputs/flutter-apk/app-release.apk
